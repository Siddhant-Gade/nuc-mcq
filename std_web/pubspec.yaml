name: std_web
description: "MS-CIT Student Web Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  supabase_flutter: ^2.17.2
  flutter_bloc: ^9.1.1
  dio: ^5.11.0
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  archive: ^3.6.1
  url_launcher: ^6.3.1
  youtube_player_iframe: ^4.0.4
  google_sign_in: ^6.2.2
  intl: ^0.20.2
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/icon/
    - assets/subjects/
    - google_fonts/
